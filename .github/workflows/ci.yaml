name: CI

on:
  push:
  pull_request:

jobs:
  validate-postgresql-vs-mongodb:
    name: Validate PostgreSQL vs MongoDB experiment
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: benchmarks/loadgen-db/go.mod

      - name: Verify Docker Compose availability
        run: docker compose version

      - name: Run validation script
        run: bash ./scripts/validate-postgresql-vs-mongodb.sh

  smoke-postgresql-vs-mongodb:
    name: Smoke PostgreSQL vs MongoDB experiment
    runs-on: ubuntu-latest
    needs: validate-postgresql-vs-mongodb
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: benchmarks/loadgen-db/go.mod

      - name: Verify Docker Compose availability
        run: docker compose version

      - name: Run smoke benchmark
        env:
          SMOKE_COUNT: 500
        run: bash ./scripts/smoke-postgresql-vs-mongodb.sh

  validate-grpc-vs-rest:
    name: Validate gRPC vs REST experiment
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: benchmarks/loadgen-http/go.mod

      - name: Verify Docker Compose availability
        run: docker compose version

      - name: Run validation script
        run: bash ./scripts/validate-grpc-vs-rest.sh

  smoke-grpc-vs-rest:
    name: Smoke gRPC vs REST experiment
    runs-on: ubuntu-latest
    needs: validate-grpc-vs-rest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: benchmarks/loadgen-http/go.mod

      - name: Verify Docker Compose availability
        run: docker compose version

      - name: Run smoke benchmark
        env:
          SMOKE_COUNT: 1000
        run: bash ./scripts/smoke-grpc-vs-rest.sh

  validate-redis-vs-valkey:
    name: Validate Redis vs Valkey experiment
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: benchmarks/loadgen-cache/go.mod

      - name: Verify Docker Compose availability
        run: docker compose version

      - name: Run validation script
        run: bash ./scripts/validate-redis-vs-valkey.sh

  smoke-redis-vs-valkey:
    name: Smoke Redis vs Valkey experiment
    runs-on: ubuntu-latest
    needs: validate-redis-vs-valkey
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: benchmarks/loadgen-cache/go.mod

      - name: Verify Docker Compose availability
        run: docker compose version

      - name: Run smoke benchmark
        env:
          SMOKE_COUNT: 500
          SMOKE_ITER: 50
        run: bash ./scripts/smoke-redis-vs-valkey.sh

  validate-kafka-vs-rabbitmq:
    name: Validate Kafka vs RabbitMQ experiment
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: benchmarks/loadgen-msg/go.mod

      - name: Verify Docker Compose availability
        run: docker compose version

      - name: Run validation script
        run: bash ./scripts/validate-kafka-vs-rabbitmq.sh

  smoke-kafka-vs-rabbitmq:
    name: Smoke Kafka vs RabbitMQ experiment
    runs-on: ubuntu-latest
    needs: validate-kafka-vs-rabbitmq
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: benchmarks/loadgen-msg/go.mod

      - name: Verify Docker Compose availability
        run: docker compose version

      - name: Run smoke benchmark
        env:
          SMOKE_COUNT: 5000
        run: bash ./scripts/smoke-kafka-vs-rabbitmq.sh

  validate-clickhouse-vs-postgresql:
    name: Validate ClickHouse vs PostgreSQL experiment
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: benchmarks/loadgen-analytics/go.mod

      - name: Verify Docker Compose availability
        run: docker compose version

      - name: Run validation script
        run: bash ./scripts/validate-clickhouse-vs-postgresql.sh

  smoke-clickhouse-vs-postgresql:
    name: Smoke ClickHouse vs PostgreSQL experiment
    runs-on: ubuntu-latest
    needs: validate-clickhouse-vs-postgresql
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: benchmarks/loadgen-analytics/go.mod

      - name: Verify Docker Compose availability
        run: docker compose version

      - name: Run smoke benchmark
        run: bash ./scripts/smoke-clickhouse-vs-postgresql.sh
