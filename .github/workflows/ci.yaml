    runs-on: ubuntu-latest
    needs: validate-prometheus-vs-victoriametrics
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: benchmarks/loadgen-observability/go.mod

      - name: Verify Docker Compose availability
        run: docker compose version

      - name: Run smoke benchmark
        env:
          SMOKE_COUNT: 20000
          SMOKE_SERIES: 200
          SMOKE_ITER: 1
        run: bash ./scripts/smoke-prometheus-vs-victoriametrics.sh

