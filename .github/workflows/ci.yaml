      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: benchmarks/loadgen-scheduler/go.mod

      - name: Set up kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Install Nomad
        env:
          NOMAD_VERSION: 1.11.3
        run: |
          curl -fsSLo /tmp/nomad.zip "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_linux_amd64.zip"
          curl -fsSLo /tmp/nomad_SHA256SUMS "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_SHA256SUMS"
          grep "nomad_${NOMAD_VERSION}_linux_amd64.zip" /tmp/nomad_SHA256SUMS | awk '{print $1 "  /tmp/nomad.zip"}' | sha256sum --check
          unzip -q /tmp/nomad.zip -d /tmp/nomad-bin
          sudo install /tmp/nomad-bin/nomad /usr/local/bin/nomad
          nomad version

      - name: Run smoke benchmark
        env:
          SMOKE_ROUNDS: 1
          SMOKE_REPLICAS: 3
          NOMAD_USE_SUDO: 1
        run: bash ./scripts/smoke-kubernetes-vs-nomad.sh

