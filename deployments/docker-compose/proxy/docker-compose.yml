services:
  # NGINX reverse proxy — catch-all location forwarding every path to the
  # shared bench-api running on the host (:8080). stub_status is exposed on
  # /nginx_status and scraped via the nginx-prometheus-exporter sidecar.
  nginx:
    image: nginx:1.27
    ports:
      - "8090:80"     # proxy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "service", "nginx", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Exports NGINX stub_status metrics in Prometheus format on :9113.
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.0
    command:
      - "--nginx.scrape-uri=http://nginx:80/nginx_status"
    depends_on:
      - nginx

  # Traefik reverse proxy — file provider (static route to the same upstream).
  # Prometheus metrics + dashboard are served on the internal "traefik"
  # entrypoint (:8080), published to the host on :8092.
  traefik:
    image: traefik:v3.3
    command:
      - "--entrypoints.web.address=:80"
      - "--entrypoints.traefik.address=:8080"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=traefik"
      - "--metrics.prometheus.addentrypointslabels=true"
      - "--metrics.prometheus.addserviceslabels=true"
      - "--ping=true"
      - "--log.level=ERROR"
      - "--accesslog=false"
    ports:
      - "8091:80"     # proxy
      - "8092:8080"   # dashboard (/dashboard/) + /metrics
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Prometheus scrapes both proxies (and the backend) — see prometheus.yml.
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9098:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - nginx
      - traefik

  # Grafana with a pre-provisioned Prometheus datasource.
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3006:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
