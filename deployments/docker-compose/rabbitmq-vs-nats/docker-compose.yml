services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: bench
      RABBITMQ_DEFAULT_PASS: benchpass
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  nats:
    image: nats:2.10-alpine
    hostname: nats
    ports:
      - "4222:4222"
      - "8222:8222"   # HTTP monitoring
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  rabbitmq-exporter:
    image: kbudde/rabbitmq-exporter:latest
    environment:
      RABBIT_URL: http://rabbitmq:15672
      RABBIT_USER: bench
      RABBIT_PASSWORD: benchpass
      PUBLISH_PORT: 9419
      OUTPUT_FORMAT: TTY
    depends_on:
      rabbitmq:
        condition: service_healthy

  nats-exporter:
    image: natsio/prometheus-nats-exporter:latest
    command: ["-varz", "http://nats:8222"]
    ports:
      - "7777:7777"
    depends_on:
      nats:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9096:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - rabbitmq-exporter
      - nats-exporter

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3004:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    depends_on:
      - prometheus

volumes:
  rabbitmq_data:
