services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      CLICKHOUSE_DB: bench
      CLICKHOUSE_USER: bench
      CLICKHOUSE_PASSWORD: benchpass
    ports:
      - "9000:9000"   # native protocol (benchmark tool)
      - "8123:8123"   # HTTP interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  postgres:
    image: postgres:16
    ports:
      - "5433:5432"   # offset to avoid conflict with exp #1
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: benchpass
      POSTGRES_DB: bench
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  clickhouse-exporter:
    image: f1yegor/clickhouse-exporter:latest
    environment:
      CLICKHOUSE_USER: bench
      CLICKHOUSE_PASSWORD: benchpass
    command: ["-scrape_uri=http://bench:benchpass@clickhouse:8123/"]
    ports:
      - "9116:9116"
    depends_on:
      clickhouse:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9095:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - clickhouse-exporter

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3003:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  clickhouse_data:
  pg_data:
