services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: obs-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"   # remote_write + PromQL (benchmark target)
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.102.0
    container_name: obs-victoriametrics
    ports:
      - "8428:8428"   # remote_write + PromQL (benchmark target)
    volumes:
      - victoriametrics_data:/victoria-metrics-data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8428/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  meta-prometheus:
    image: prom/prometheus:v2.55.1
    container_name: obs-meta-prometheus
    command:
      - --config.file=/etc/prometheus/meta-prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9098:9090"
    volumes:
      - ./meta-prometheus.yml:/etc/prometheus/meta-prometheus.yml:ro
      - meta_prometheus_data:/prometheus
    depends_on:
      prometheus:
        condition: service_healthy
      victoriametrics:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3006:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - meta-prometheus

volumes:
  prometheus_data:
  victoriametrics_data:
  meta_prometheus_data:
