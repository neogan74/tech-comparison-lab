services:
  # Kong API gateway — DB-less (declarative) mode.
  # Proxies every path to the shared bench-api running on the host (:8080).
  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/null
      KONG_ADMIN_ACCESS_LOG: /dev/null
      KONG_NGINX_WORKER_PROCESSES: "auto"
    ports:
      - "8000:8000"   # proxy
      - "8001:8001"   # admin API
    volumes:
      - ./kong:/kong:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis — required by Tyk Gateway for rate-limiting/session storage,
  # even in keyless (no auth) mode with analytics disabled.
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Tyk Gateway (community edition) — file-based API definition (no dashboard).
  # Proxies every path to the same bench-api running on the host (:8080).
  tyk:
    image: tykio/tyk-gateway:v5.3
    ports:
      - "8090:8080"   # proxy
    volumes:
      - ./tyk/tyk.conf:/opt/tyk-gateway/tyk.conf:ro
      - ./tyk/apps:/opt/tyk-gateway/apps:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/hello"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
