# NGINX reverse-proxy config for the Envoy vs NGINX experiment.
# Catch-all location forwarding every path to the shared bench-api on the host,
# with a stub_status endpoint for the Prometheus exporter.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log off;

    # Keep-alive pool to the upstream so the proxy hop mirrors Envoy's
    # persistent upstream connections (fair comparison of raw proxy cost).
    upstream bench_api {
        server host.docker.internal:8080;
        keepalive 32;
    }

    server {
        listen 80;

        # Prometheus stub_status metrics (scraped by nginx-exporter).
        location = /nginx_status {
            stub_status;
        }

        location / {
            proxy_pass http://bench_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
