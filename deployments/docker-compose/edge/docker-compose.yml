services:
  # NGINX reverse proxy — catch-all location forwarding every path to the
  # shared bench-api running on the host (:8080). stub_status is exposed on
  # /nginx_status and scraped via the nginx-prometheus-exporter sidecar.
  nginx:
    image: nginx:1.27
    ports:
      - "8093:80"     # proxy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "service", "nginx", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Exports NGINX stub_status metrics in Prometheus format on :9113.
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.0
    command:
      - "--nginx.scrape-uri=http://nginx:80/nginx_status"
    depends_on:
      - nginx

  # Envoy reverse proxy — static bootstrap with a catch-all route to the same
  # upstream. Admin (/stats/prometheus, /ready) is published on :8095.
  envoy:
    image: envoyproxy/envoy:v1.32-latest
    command:
      - "--config-path"
      - "/etc/envoy/envoy.yaml"
      - "--log-level"
      - "error"
    ports:
      - "8094:10000"  # proxy (Envoy binds :10000 — it runs unprivileged)
      - "8095:9901"   # admin + /stats/prometheus
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No container healthcheck: the Envoy image ships no shell HTTP client, so
    # readiness is probed from the host (`/ready` on :8095) by run.sh instead.

  # Prometheus scrapes both proxies (and the backend) — see prometheus.yml.
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9099:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - nginx
      - envoy

  # Grafana with a pre-provisioned Prometheus datasource.
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3008:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
