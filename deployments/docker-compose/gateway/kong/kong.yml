_format_version: "3.0"

# DB-less declarative config: one service (the shared bench-api on the host)
# with a catch-all route so Kong proxies every path unchanged. strip_path is
# false so /echo, /users/{id} and /orders reach the upstream verbatim.
services:
  - name: bench-api
    url: http://host.docker.internal:8080
    routes:
      - name: catch-all
        paths:
          - /
        strip_path: false

# Enable the Prometheus plugin globally so Kong exposes request/latency/upstream
# metrics on the Admin API at :8001/metrics.
plugins:
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true
