global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  # Kong exposes Prometheus metrics on its Admin API listener.
  - job_name: kong
    metrics_path: /metrics
    static_configs:
      - targets: ["kong:8001"]

  # Traefik exposes metrics on the internal "traefik" entrypoint (:8080).
  - job_name: traefik
    metrics_path: /metrics
    static_configs:
      - targets: ["traefik:8080"]

  # The shared backend runs on the host.
  - job_name: bench-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
