services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-benchpass}
      POSTGRES_DB: bench
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  cockroachdb:
    image: cockroachdb/cockroach:latest
    command: >
      start-single-node --insecure
      --listen-addr=127.0.0.1:26257
      --sql-addr=0.0.0.0:26257
      --http-addr=0.0.0.0:8080
      --store=type=mem,size=1GiB
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - ./cockroachdb/init.sql:/cockroach/init.sql:ro

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://bench:${POSTGRES_PASSWORD:-benchpass}@postgres:5432/bench?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - postgres-exporter
      - cockroachdb

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  pg_data: