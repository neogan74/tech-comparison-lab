services:
  # --- Zabbix side: PostgreSQL + server (trapper) + web (JSON-RPC API) ---
  zabbix-postgres:
    image: postgres:15-alpine
    container_name: mon-zabbix-postgres
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
    volumes:
      - zabbix_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-6.4-latest
    container_name: mon-zabbix-server
    environment:
      DB_SERVER_HOST: zabbix-postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
      # Reload the config cache every 10s so newly created trapper items become
      # active quickly (default is 60s) — see the loadgen waitItemsActive probe.
      ZBX_CACHEUPDATEFREQUENCY: "10"
    ports:
      - "10051:10051"   # trapper (benchmark ingest target)
    depends_on:
      zabbix-postgres:
        condition: service_healthy

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-6.4-latest
    container_name: mon-zabbix-web
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
      PHP_TZ: UTC
    ports:
      - "8090:8080"     # JSON-RPC API (api_jsonrpc.php)
    depends_on:
      zabbix-postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_started

  # --- Prometheus side: single node with remote_write receiver ---
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: mon-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"     # remote_write + PromQL (benchmark target)
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  grafana:
    image: grafana/grafana:latest
    container_name: mon-grafana
    ports:
      - "3007:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  zabbix_pg_data:
  prometheus_data:
